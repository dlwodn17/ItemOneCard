<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#397eb0">
    <title>LAST ONE · 원카드 로비</title>
    <style>
        /* 공통 디자인 */
        :root {
            --ink: #203b57;
            --muted: #70869b;
            --line: #d5e5f1;
            --sky: #d5edfc;
            --blue: #397eb0;
            --paper: #fff;
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            margin: 0;
            background: #edf6fc;
            color: var(--ink);
            font: 14px/1.6 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        }
        button, input { font: inherit; }
        button { cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: .55; }
        button:focus-visible, input:focus-visible {
            outline: 3px solid #57a6de;
            outline-offset: 3px;
        }
        h1, h2, h3, p { margin: 0; }
        .app { max-width: 1100px; margin: auto; padding: 28px; }
        .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .brand-mark {
            display: grid; place-items: center;
            width: 38px; height: 48px; border: 2px solid var(--blue);
            border-radius: 8px; background: var(--sky); font: bold 27px Georgia, serif;
        }
        .brand-name { font: 900 23px "Arial Black", sans-serif; letter-spacing: -1px; }
        .brand-caption { color: var(--muted); font-size: 11px; }
        .preview-tag {
            margin-left: auto; padding: 6px 11px; border-radius: 16px;
            background: var(--sky); color: #416983; font-size: 12px;
        }
        .layout { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 20px; }
        .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
        .profile { padding: 22px 16px; text-align: center; }
        .avatar {
            display: grid; place-items: center; flex: none;
            width: 45px; height: 45px; border-radius: 14px;
            background: var(--sky); color: var(--blue); font-size: 25px;
        }
        .profile .avatar { margin: 0 auto 12px; }
        .profile h2 { font-size: 16px; }
        .muted { color: var(--muted); font-size: 12px; }
        .profile-details {
            display: grid; gap: 12px; margin-top: 20px; padding-top: 17px;
            border-top: 1px solid var(--line); text-align: left;
        }
        .profile-details span { display: block; color: var(--muted); font-size: 12px; }
        .profile-details strong { font-size: 13px; }
        .welcome { padding: 24px; background: var(--sky); margin-bottom: 18px; }
        .welcome h1 { margin-bottom: 7px; font-size: 23px; }
        .welcome p { color: #5d7c94; font-size: 13px; }
        .room-panel { padding: 22px; }
        .section-heading {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
        }
        .section-heading h2 { font-size: 17px; }
        .badge { padding: 4px 8px; border-radius: 6px; background: #eaf3fa; color: #5e7b92; font-size: 12px; }
        .button {
            padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px;
            background: var(--paper); color: var(--ink); font-weight: 700;
        }
        .button:hover { background: #eaf4fb; }
        .button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
        .button.primary:hover { background: #2e6c9a; }
        .rooms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .room-card { padding: 18px; border: 1px solid var(--line); border-radius: 10px;background: var(--paper);
            width: 100%;min-width: 0; }
        .room-card h3 { margin: 10px 0 5px; font-size: 15px; overflow-wrap: anywhere; }
        .room-card-top, .room-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .room-card-footer { margin-top: 18px; padding-top: 13px; border-top: 1px solid var(--line); }
        .empty-state { grid-column: 1 / -1; padding: 30px; text-align: center; color: var(--muted); }
        .local-note { margin-top: 16px; color: var(--muted); font-size: 12px; }

        /* 방 대기실 */
        .screen-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
        .screen-heading h1 { font-size: 21px; overflow-wrap: anywhere; }
        .waiting-top {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 10px; padding: 20px; border-bottom: 1px solid var(--line);
        }
        .waiting-seats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 20px; }
        .waiting-seat {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 9px; min-height: 150px; padding: 16px;
            border: 1px solid var(--line); border-radius: 10px; text-align: center;
        }
        .waiting-seat.mine { border-color: #8fbfe0; background: #edf7fd; }
        .waiting-seat.empty { border-style: dashed; color: var(--muted); background: #f8fbfe; }
        .waiting-seat strong { max-width: 100%; overflow-wrap: anywhere; }

        /* 방 만들기 팝업과 작은 화면 */
        dialog {
            width: min(420px, calc(100% - 32px)); padding: 22px;
            border: 1px solid var(--line); border-radius: 14px;
            color: var(--ink); background: var(--paper);
        }
        dialog::backdrop { background: #203b5766; }
        .dialog-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
        .dialog-heading h2 { font-size: 19px; }
        .close-button { padding: 2px 10px; border: 0; border-radius: 6px; background: #eaf3fa; color: var(--ink); font-size: 22px; }
        .field-label { display: block; margin-bottom: 8px; font-weight: 700; }
        .field { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); }
        .dialog-hint { margin-top: 9px; color: var(--muted); font-size: 12px; }
        .error { min-height: 22px; margin-top: 12px; color: #b15342; font-size: 13px; }
        .dialog-submit { width: 100%; margin-top: 8px; }
        @media (max-width: 760px) {
            .app { padding: 18px; }
            .layout { grid-template-columns: 1fr; }
            .profile { display: flex; align-items: center; gap: 14px; padding: 16px; text-align: left; }
            .profile .avatar { margin: 0; }
            .profile-details { margin: 0 0 0 auto; padding: 0; border: 0; }
            .profile-mode { display: none; }
        }
        @media (max-width: 480px) {
            .app { padding: 14px; }
            .brand-name { font-size: 20px; }
            .preview-tag { font-size: 10px; padding: 5px 8px; }
            .welcome, .room-panel { padding: 18px; }
            .welcome h1 { font-size: 20px; }
            .rooms { grid-template-columns: 1fr; }
            .waiting-seats { padding: 14px; gap: 10px; }
            .waiting-seat { min-height: 140px; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <span class="brand-mark" aria-hidden="true">1</span>
            <div>
                <div class="brand-name">LAST ONE</div>
                <p class="brand-caption">아이템 원카드</p>
            </div>
            <span class="preview-tag">로컬 시안</span>
        </header>

        <div class="layout">
            <aside aria-label="내 정보">
                <section class="panel profile">
                    <div class="avatar" aria-hidden="true">♠</div>
                    <div>
                        <h2 id="profile-name"></h2>
                        <p class="muted">로컬 플레이어</p>
                    </div>
                    <div class="profile-details">
                        <div><span>현재 위치</span><strong id="profile-location">로비</strong></div>
                        <div class="profile-mode"><span>게임 모드</span><strong>일반 원카드</strong></div>
                    </div>
                </section>
            </aside>

            <main>
                <!-- 처음에는 로비만 표시 -->
                <section data-screen="lobby" aria-labelledby="lobby-title">
                    <div class="panel welcome">
                        <h1 id="lobby-title" tabindex="-1">어떤 방에서 한 판 할까요?</h1>
                        <p>함께할 방을 선택하거나 새로운 방을 만들어보세요.</p>
                    </div>
                    <section class="panel room-panel" aria-labelledby="room-list-title">
                        <div class="section-heading">
                            <h2 id="room-list-title">게임방 <span class="badge" id="room-count"></span></h2>
                            <button class="button primary" id="open-create" type="button">+ 방 만들기</button>
                        </div>
                        <div class="rooms" id="room-list"></div>
                        <p class="error" id="room-error" role="alert" hidden></p>
                    </section>
                </section>

                <!-- 방을 만들거나 선택하면 표시하는 대기실 -->
                <section data-screen="waiting" hidden aria-labelledby="waiting-title">
                    <div class="screen-heading">
                        <button class="button" id="leave-room" type="button">← 로비로</button>
                        <h1 id="waiting-title" tabindex="-1"></h1>
                        <button class="button primary" id="start-game" type="button" style="margin-left: auto;" disabled hidden>게임 시작</button>
                    </div>
                    <section class="panel" aria-label="방 정보와 참가자">
                        <div class="waiting-top">
                            <div>
                                <strong>일반 원카드 · 최대 4명</strong>
                                <p class="muted" id="waiting-number"></p>
                            </div>
                            <span class="badge" id="waiting-count"></span>
                        </div>
                        <div class="waiting-seats" id="waiting-seats"></div>
                    </section>
                </section>
                <!-- 게임 실행 화면 안에 내용 지우고 수정해도 됨) -->
                <section data-screen="game" hidden aria-labelledby="game-title">
                    <div class="screen-heading">
                        <h1 id="game-title" tabindex="-1">LAST ONE · 게임 진행 중</h1>
                    </div>
                    <section class="panel" style="padding: 24px; text-align: center;">
                        <h2>🎮 게임판이 준비 중입니다!</h2>
                        <p class="muted" style="margin-top: 10px;" id="game-info-text"></p>
                    </section>
                </section>
            </main>
        </div>
    </div>

    <dialog id="create-dialog" aria-labelledby="create-title">
        <div class="dialog-heading">
            <h2 id="create-title">새로운 방 만들기</h2>
            <button class="close-button" id="close-create" type="button" aria-label="닫기">×</button>
        </div>
        <form id="create-form">
            <label class="field-label" for="create-name">방 이름</label>
            <input class="field" id="create-name" maxlength="40" placeholder="친구들과 즐거운 한 판" required>
            <p class="dialog-hint">최대 40자 · 일반 원카드 · 최대 4명</p>
            <p class="error" id="create-error" role="alert"></p>
            <button class="button primary dialog-submit" type="submit">방 만들고 입장하기</button>
        </form>
    </dialog>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        'use strict';

        // 1. 로비 정보 
        // 공개 목록/초대 코드 정책은 아직 확정하지 않았음.
        const $ = id => document.getElementById(id);
        const escapeHTML = value => String(value).replace(/[&<>"']/g, character => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[character]));
        // 소켓 서버연결 
        const socket = io('http://localhost:3000');
        const MAX_PLAYERS = 4;
        const MAX_CAPACITY = 6;
        const me = { id: 'user_' + Math.random().toString(36).substr(2, 9), name: '플레이어_' + Math.floor(Math.random() * 100)};
        const state = {
            screen: 'lobby',
            currentRoom: null,
            rooms: [],
        };

        // 접속하자마자 서버에 현재 방 목록 달라고 요청
        socket.emit('getRoomList');

        // 서버로부터 방 목록 응답 받기
        socket.on('roomListResponse', (serverRooms) => {
            state.rooms = serverRooms;
            renderRooms();
        });

        // 실시간 방 목록 갱신 
        socket.on('roomListUpdated', (serverRooms) => {
            state.rooms = serverRooms;
            if (state.screen === 'lobby') {
                renderRooms();
            }
        });

        // 2. 현재 데이터를 화면에 표시.
        function showScreen(screen, focus = true) {
            state.screen = screen;
            document.querySelectorAll('[data-screen]').forEach(section => {
                section.hidden = section.dataset.screen !== screen;
            });
            if (screen === 'lobby') {
                $('profile-location').textContent = '로비';
            } else if (screen === 'waiting') {
                $('profile-location').textContent = '방 대기실';
            } else if (screen === 'game') {
                $('profile-location').textContent = '게임 중';
            }

            if (focus) {
                $(screen === 'lobby' ? 'lobby-title' : 'waiting-title').focus({ preventScroll: true });
            }
        }
        
        //3. 방 렌더링 함수.
        //기존에 로컬로 하드코딩 되있는 부분 소켓 연결하면서 삭제함
        //현재 위치: 대기 중, 정원 마감에서 게임 중 추가
        //상태: 입장하기, 가득참에서 진행 중 추가
        //방이 가득찼는지 플레이어 수, 관전자 수 카운트해서 상태 업데이트
        function renderRooms() {
            $('room-error').textContent = '';$('room-error').hidden = true;
            $('room-count').textContent = `${state.rooms.length}개`;
            
        
            $('room-list').innerHTML = state.rooms.map(room => {
                const full = room.isFull;
                const playing = room.isPlaying;
                const pCount = room.playerCount || 0;
                const sCount = room.specCount || 0;

                let badgeText = '대기 중';
                if (playing) {
                    badgeText = '게임 중';
                } else if (full) {
                    badgeText = '정원 마감';
                }

                return `
                    <article class="room-card">
                        <div class="room-card-top">
                            <span class="muted">ROOM ${escapeHTML(room.id)}</span>
                            <span class="badge">${badgeText}</span>
                        </div>
                        <h3>${escapeHTML(room.title)}</h3>
                        <p class="muted">방장 · ${escapeHTML(room.hostName)}</p>
                        <div class="room-card-footer">
                            <span class="muted">참가자 ${pCount} / ${MAX_PLAYERS}</span>
                            <span class="muted">관전자 ${sCount} / ${MAX_CAPACITY - MAX_PLAYERS}</span>
                            <button class="button ${playing||full ? '' : 'primary'}" type="button" data-room-id="${escapeHTML(room.id)}"
                                aria-label="${escapeHTML(room.title)} 입장" ${full ? 'disabled' : ''}>
                                ${playing? '진행 중' : (full ? '가득 참' : '입장하기')}
                            </button>
                        </div>
                    </article>`;
            }).join('') || '<p class="empty-state">아직 방이 없어요. 새로운 방을 만들어보세요.</p>';
        
        }

        //4. 대기방 로직.
        // 기존에 플레이어 4명 다 차면 방 닫히는 로직 플레이어 4명 모이면 방장이 게임 시작할 수 있는 조건으로 변경
        // 플레이어가 한명 빠질 때마다 들어온 순서대로 한칸 씩 땡겨지는 백엔드 로직에 따라 방장/플레이어/관전자 표시
        // 꼭 방이 풀방 아니더라도 플레이어 4명 모이면 방장한테 게임시작 버튼 뜸
       function renderWaiting() {
            const room = state.currentRoom;
            if (!room) return;
            $('waiting-title').textContent = room.title;
            $('waiting-number').textContent = `ROOM ${room.id}`;
            
            const players = room.players || [];
            const spectators = room.spectators || [];
            const totalMembers = players.length + spectators.length;
            $('waiting-count').textContent = `참가자 ${totalMembers} / ${MAX_CAPACITY}명`; 
            
            const seatsContainer = $('waiting-seats');
            const isFullPlayers = players.length === MAX_PLAYERS;
            const startBtn = $('start-game');
            const isUserHost = room.hostId === socket.id;
            
            if (isUserHost) {
                startBtn.hidden = false;
                startBtn.disabled = !isFullPlayers;
                startBtn.textContent = isFullPlayers ? '게임 시작' : `대기 중 (${players.length}/4)`;
            } else {
                startBtn.hidden = true;
            }

            let html = '';

            for (let i = 1; i <= MAX_PLAYERS; i++) {
                const player = players.find(p => p.id === `P${i}`);
                if (!player) {
                    html += `<div class="waiting-seat empty"><strong>P${i} 빈자리</strong><span class="muted">참가자를 기다리고 있어요</span></div>`;
                } else {
                    const mine = player.socketId === socket.id;
                    const isHost = player.socketId === room.hostId;
                    html += `
                        <div class="waiting-seat ${mine ? 'mine' : ''}">
                            <div class="avatar" aria-hidden="true">${mine ? '♠' : '♣'}</div>
                            <strong>${escapeHTML(player.name)}${mine ? ' · 나' : ''}</strong>
                            <span class="muted">${isHost ? '👑 방장' : '플레이어'} (${player.id})</span>
                        </div>`;
                }
            }

            for(let i = 1; i <= MAX_CAPACITY - MAX_PLAYERS; i++) {
                const spec = spectators.find(s => s.id === `관전자${i}`);
                if (!spec) {
                    html += `<div class="waiting-seat empty" style="border-style: dashed; background: #fafbfc;"><strong>관전자 ${i} 빈자리</strong><span class="muted">관전 대기 중</span></div>`;
                } else {
                    const mine = spec.socketId === socket.id;
                    const isHost = spec.socketId === room.hostId;
                    html += `
                        <div class="waiting-seat ${mine ? 'mine' : ''}">
                            <div class="avatar" aria-hidden="true">👁️</div>
                            <strong>${escapeHTML(spec.name)}${mine ? ' · 나' : ''}</strong>
                            <span class="muted">${isHost ? '방장' : '관전자'} (${spec.id})</span>
                        </div>`;
                }
            }
            
            seatsContainer.innerHTML = html;
            
        }

        $('start-game').addEventListener('click', () => {
            socket.emit('startGame');
        });

        // 서버로부터 게임 시작 신호를 받았을 때 게임판 화면으로 전환
        // 게임판 전환까지는 구현, 게임판 구성 및 디자인은 고쳐야 함!
        socket.on('gameStart', ({ players, hostId }) => {
            showScreen('game'); // 게임 화면으로 전환

            const myPlayer = players.find(p => p.socketId === socket.id);
            const mySpectator = spectators ? spectators.find(s => s.socketId === socket.id) : null;
            
            let roleText = '참가자';
            if (myPlayer) {
                roleText = `${myPlayer.id} (플레이어)`;
            } else if (mySpectator) {
                roleText = `${mySpectator.id} (관전자)`;
            }

            $('game-info-text').textContent = `참가 완료! 내 역할: ${roleText} (${me.name})`;
            console.log('게임 시작 데이터 수신:', players);
        });

        // 서버로부터 방 입장 성공 신호를 받았을 때
       socket.on('joinRoomSuccess', ({ roomId, myRole, roomData }) => {
            state.currentRoom = roomData;
            renderWaiting();
            showScreen('waiting'); 
        });

        // 방 안의 유저 상태(입장/퇴장/승격)가 실시간으로 바뀔 때
        socket.on('roomStateUpdated', ({ players, spectators,hostId }) => {
            if (state.currentRoom) {
                state.currentRoom.players = players;
                state.currentRoom.spectators = spectators;
                if (hostId) state.currentRoom.hostId = hostId;
                renderWaiting();
            }
        });

        // 에러 메시지 수신 시
        socket.on('errorMsg', (msg) => {
            alert(msg);
        });

        // 버튼 이벤트 리스너 연결
        $('open-create').addEventListener('click', () => {
            $('create-form').reset();$('create-error').textContent = '';
            $('create-dialog').showModal();$('create-name').focus();
        });

        $('close-create').addEventListener('click', () =>$('create-dialog').close());

        // 방 만들기 폼 제출 -> 서버로 'createRoom' 이벤트 전송
        $('create-form').addEventListener('submit', event => {
            event.preventDefault();
            const title = $('create-name').value.trim();
            if (!title) {
                $('create-error').textContent = '방 이름을 입력해주세요.';
                return;
            }
            socket.emit('createRoom', { title, playerName: me.name });
            $('create-dialog').close();
        });

        // 방 목록에서 '입장하기' 클릭 -> 서버로 'joinRoom' 이벤트 전송
        $('room-list').addEventListener('click', event => {
            const button = event.target.closest('[data-room-id]');
            if (!button || button.disabled) return;
            socket.emit('joinRoom', { roomId: button.dataset.roomId, playerName: me.name });
        });

        // '로비로 나가기' 클릭 -> 서버로 'leaveRoom' 이벤트 전송
        $('leave-room').addEventListener('click', () => {
            socket.emit('leaveRoom');
            state.currentRoom = null;
            showScreen('lobby');
            socket.emit('getRoomList'); // 로비 돌아와서 방 목록 새로고침
        });

        // 초기 실행
        $('profile-name').textContent = me.name;
        showScreen('lobby', false);

    </script>
</body>
</html>
